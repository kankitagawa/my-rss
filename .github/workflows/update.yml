name: Update RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *' # 毎日 日本時間 06:17 頃（遅延する場合あり）

concurrency:
  group: rss-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      errors: ${{ steps.generate.outputs.errors }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        env:
          GITHUB_STEP_SUMMARY: ""
        run: python -m unittest discover -s tests -v
      - name: Generate RSS
        id: generate
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python update_all.py --base-url "$SITE_URL" --allow-partial
      - name: Save history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS history'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  check-results:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report site failures after publishing working feeds
        env:
          ERRORS: ${{ needs.build.outputs.errors }}
        run: |
          if [ "$ERRORS" != "0" ]; then
            echo "::error::Some sites failed. Working feeds were published; inspect build summary and status.json."
            exit 1
          fi
